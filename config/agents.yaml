schema_version: 1
runtime:
  provider: codex
  declaration_mode: repository_contract
  persistent_role: main_agent
  default_timeout_seconds: 900
  result_schema: config/schemas/agent-result.schema.json
  change_proposal_schema: config/schemas/change-proposal.schema.json
  output_schemas:
    planning_candidate: config/schemas/planning-candidate.schema.json
    chapter_draft_candidate: config/schemas/text-candidate.schema.json
    review_receipt_candidate: config/schemas/review-receipt-candidate.schema.json

spawn_gates:
  context_builder:
    evidence_field: complexity_reasons
    allowed_values:
      - cross_volume
      - multiple_threads
      - conflicting_facts
      - context_overflow

read_only_tools: &read_only_tools
  - planning.get
  - planning.list
  - creator_profile.get
  - creator_profile.get_version
  - memory.recent_chapters
  - memory.search_facts
  - memory.get_entity_states
  - memory.get_authority_snapshot
  - knowledge.search
  - knowledge.get
  - skill_catalog.search
  - skill_catalog.get
  - skill_catalog.validate
  - skill_catalog.validate_input
  - skill_catalog.validate_output
  - skill_catalog.validate_contract_inputs
  - skill_catalog.review_route

review_tools: &review_tools
  - review.get_subject
  - planning.get
  - planning.list
  - creator_profile.get
  - creator_profile.get_version
  - memory.recent_chapters
  - memory.search_facts
  - memory.get_entity_states
  - memory.get_authority_snapshot
  - knowledge.search
  - knowledge.get
  - skill_catalog.search
  - skill_catalog.get
  - skill_catalog.validate
  - skill_catalog.validate_input
  - skill_catalog.validate_output
  - skill_catalog.validate_contract_inputs
  - skill_catalog.review_route

review_profile_routes:
  planning-direction: [planning-quality-review, planning-direction-review]
  planning-architecture: [planning-quality-review, planning-architecture-review]
  planning-strategy: [planning-quality-review, planning-strategy-review]
  planning-character-contract: [planning-quality-review, planning-character-contract-review]
  planning-world-contract: [planning-quality-review, planning-world-contract-review]
  planning-story-arc: [planning-quality-review, planning-story-arc-review]
  planning-volume-outline: [planning-quality-review, planning-volume-outline-review]
  planning-chapter-plan: [planning-quality-review, planning-chapter-plan-review]
  planning-character-world-cross-consistency: [planning-cross-consistency-review]
  entity-character: [entity-authority-review]
  entity-world: [entity-authority-review]
  entity-faction: [entity-authority-review]
  entity-rule: [entity-authority-review]
  entity-timeline: [entity-authority-review]
  prose-v1: [prose-quality-review]
  continuity-v1: [continuity-quality-review]

roles:
  main_agent:
    display_name: 主控智能体
    kind: main
    lifecycle: persistent
    owned_asset_type: null
    required_upstream_types: []
    minimum_inputs:
      - user_request
      - task_state
    allowed_tools:
      - "*"
    output_types:
      - routing_decision
      - final_response
    review_profile: null
    catalog_package: null
    spawn_condition: never
    must_destroy: false

  direction_agent:
    display_name: 方向智能体
    kind: planning_asset
    lifecycle: temporary
    owned_asset_type: direction
    required_upstream_types: []
    minimum_inputs:
      - project_profile_ref
      - user_constraints
      - creator_signature_ref
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - planning_candidate
      - change_proposal
    review_profile: planning-direction
    catalog_package: story-direction
    spawn_condition: direction_candidate_required
    must_destroy: true

  architecture_agent:
    display_name: 架构智能体
    kind: planning_asset
    lifecycle: temporary
    owned_asset_type: architecture
    required_upstream_types:
      - direction
    minimum_inputs:
      - locked_direction_ref
      - project_constraints
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - planning_candidate
      - change_proposal
    review_profile: planning-architecture
    catalog_package: story-architecture
    spawn_condition: architecture_candidate_required
    must_destroy: true

  strategy_agent:
    display_name: 策略智能体
    kind: planning_asset
    lifecycle: temporary
    owned_asset_type: strategy
    required_upstream_types:
      - direction
      - architecture
    minimum_inputs:
      - locked_direction_ref
      - locked_architecture_ref
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - planning_candidate
      - change_proposal
    review_profile: planning-strategy
    catalog_package: story-strategy
    spawn_condition: strategy_candidate_required
    must_destroy: true

  character_agent:
    display_name: 人物智能体
    kind: planning_asset
    lifecycle: temporary
    owned_asset_type: character_contract
    required_upstream_types:
      - architecture
      - strategy
    minimum_inputs:
      - locked_architecture_ref
      - locked_strategy_ref
      - canon_character_refs
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - planning_candidate
      - change_proposal
    review_profile: planning-character-contract
    catalog_package: character-contract
    spawn_condition: character_contract_candidate_required
    must_destroy: true

  world_agent:
    display_name: 世界观智能体
    kind: planning_asset
    lifecycle: temporary
    owned_asset_type: world_contract
    required_upstream_types:
      - architecture
      - strategy
    minimum_inputs:
      - locked_architecture_ref
      - locked_strategy_ref
      - canon_world_refs
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - planning_candidate
      - change_proposal
    review_profile: planning-world-contract
    catalog_package: world-contract
    spawn_condition: world_contract_candidate_required
    must_destroy: true

  story_arc_agent:
    display_name: 故事弧智能体
    kind: planning_asset
    lifecycle: temporary
    owned_asset_type: story_arc
    required_upstream_types:
      - strategy
      - character_contract
      - world_contract
    minimum_inputs:
      - locked_strategy_ref
      - locked_character_contract_ref
      - locked_world_contract_ref
      - character_world_cross_review_ref
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - planning_candidate
      - change_proposal
    review_profile: planning-story-arc
    catalog_package: story-arc
    spawn_condition: story_arc_candidate_required
    must_destroy: true

  volume_planner:
    display_name: 卷规划智能体
    kind: planning_asset
    lifecycle: temporary
    owned_asset_type: volume_outline
    required_upstream_types:
      - story_arc
    minimum_inputs:
      - locked_story_arc_ref
      - target_volume_ref
      - canon_snapshot_ref
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - planning_candidate
      - change_proposal
    review_profile: planning-volume-outline
    catalog_package: volume-outline
    spawn_condition: volume_outline_candidate_required
    must_destroy: true

  chapter_planner:
    display_name: 章节规划智能体
    kind: planning_asset
    lifecycle: temporary
    owned_asset_type: chapter_plan
    required_upstream_types:
      - volume_outline
    minimum_inputs:
      - locked_volume_outline_ref
      - recent_canon_refs
      - target_chapter_window
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - planning_candidate
      - change_proposal
    review_profile: planning-chapter-plan
    catalog_package: chapter-plan-execution-card
    spawn_condition: chapter_plan_candidate_required
    must_destroy: true

  writer_agent:
    display_name: 写作智能体
    kind: production
    lifecycle: temporary
    owned_asset_type: null
    required_upstream_types:
      - chapter_plan
    minimum_inputs:
      - locked_chapter_plan_ref
      - context_package_refs
      - style_refs
      - catalog_snapshot_ref
    allowed_tools: *read_only_tools
    output_types:
      - chapter_draft_candidate
      - change_proposal
    review_profile: null
    catalog_package: chapter-draft-generation
    spawn_condition: complete_chapter_or_long_scene_required
    must_destroy: true

  review_agent:
    display_name: 审查智能体
    kind: review
    lifecycle: temporary
    owned_asset_type: null
    required_upstream_types: []
    minimum_inputs:
      - immutable_subject_ref
      - subject_hash
      - review_profile
      - authority_context_refs
    allowed_tools: *review_tools
    output_types:
      - review_receipt_candidate
    review_profile: dynamic
    catalog_package: null
    spawn_condition: independent_review_required
    must_destroy: true

  context_builder:
    display_name: 上下文构建智能体
    kind: context
    lifecycle: temporary
    owned_asset_type: null
    required_upstream_types: []
    minimum_inputs:
      - target_ref
      - retrieval_constraints
      - authority_snapshot_ref
      - complexity_reasons
    allowed_tools: *read_only_tools
    output_types:
      - context_package
    review_profile: null
    catalog_package: null
    spawn_condition: cross_volume_or_context_overflow
    must_destroy: true

cross_consistency_gate:
  profile: planning-character-world-cross-consistency
  subject_types:
    - character_contract
    - world_contract
  required_before: story_arc
  reviewer_role: review_agent
