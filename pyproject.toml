[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-novelos"
version = "0.1.0"
description = "Codex-oriented multi-agent architecture for long-form fiction"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
openai = ["openai>=1.90,<3"]
all = ["mcp>=1.12,<2", "openai>=1.90,<3"]

[project.scripts]
novelos = "novelos.cli:main"
novelos-memory-mcp = "novelos.mcp.memory_server:main"

[tool.setuptools.packages.find]
where = ["src"]

