sandbox_mode = "danger-full-access"

# NovelOS MCP 已彻底退役删除（代码移出 mcp/，门禁表已 DROP）。
# 数据库操作唯一入口：SQLite MCP（execute_sql 工具）。
# 不要重新启用 NovelOS MCP——migration 016 删除了 traces/agent_runs/authority_commits
# 等门禁表，重启会因为找不到表而崩溃。

[mcp_servers.sqlite]
command = "bash"
args = ["scripts/run_sqlite_mcp.sh"]
startup_timeout_sec = 10
tool_timeout_sec = 30
