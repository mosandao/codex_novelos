name: universe-atlas
description: 统一宇宙观设定模板库（1 份宇宙法则框架 + 13 个派生宇宙簇），供 World Agent 在生成世界契约时按本书题材检索可裁切拼合的力量体系/势力格局/世界规则/世界地图设定；每簇含宇宙法则、裁切指引与启发式推导，跨宇宙混搭由 framework 的仲裁原则裁决
stage: plan
asset: world_contract
capability: compose
lifecycle: active
version: 0.1.0
genres:
- 玄幻
- 奇幻
- 仙侠
- 科幻
- 都市
- 悬疑
- 无限
- 历史
- 架空
- 武侠
- 末世
- 星际
- 赛博
- 同人
risk: P2
output_contract: document
priority: 30
use_when:
- World Agent 在生成 world_contract 时需要按本书题材查阅可复用的宇宙法则骨架
- 新题材项目缺少力量体系/势力格局/世界规则参照时
- 跨宇宙混搭（如科幻+克苏鲁、玄幻+神话）需要仲裁原则时
avoid_when:
- 世界契约已有明确的 architecture/strategy 约束，无需外部宇宙设定参照时
- 图集未覆盖的细分宇宙，应依靠 architecture/strategy 约束直接推导而非误用不相关簇
tags:
- worldbuilding
- universe
- atlas
- cosmology
- framework
- seed
